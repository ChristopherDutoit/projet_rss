version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: rss_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: rss_db_ui
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  pgdata: